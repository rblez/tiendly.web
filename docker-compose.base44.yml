services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.svelte-kit
    command: sh -c "npm install && npm run dev -- --port 5173"
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
