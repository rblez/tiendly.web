name: Install Sentry

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-sentry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Sentry
        run: npm install @sentry/sveltekit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Sentry is already installed. No changes to commit."
            exit 0
          fi

          git add package.json package-lock.json
          git commit -m "chore: install Sentry"
          git push