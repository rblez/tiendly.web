name: release-bot

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip guard (commits del propio bot)
        id: guard
        run: |
          if git log -1 --pretty=%s | grep -q '\[release-bot skip\]'; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch + PR + merge + tag + release
        if: steps.guard.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          next_version() {
            local last
            last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            local msg
            msg="$(git log -1 --pretty=%s)"

            local major=0 minor=0 patch=0
            if [[ "$last" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
            fi

            if [[ "$msg" == *"[release: major]"* ]]; then
              major=$((major + 1)); minor=0; patch=0
            elif [[ "$msg" == *"[release: minor]"* ]]; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi

            echo "v${major}.${minor}.${patch}"
          }

          SHA="$(git rev-parse HEAD)"
          BRANCH="release-bot-$(date +%Y%m%d-%H%M%S)-${SHA:0:7}"
          VERSION="$(next_version)"
          echo "Next version: $VERSION"

          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release $VERSION [release-bot skip]" \
            --body "Release automatica generada por **release-bot** a partir del commit $SHA.

            Version: $VERSION
            Notas generadas desde el tag anterior en la seccion de Releases.
            Para forzar bump: [release: major] o [release: minor] en el mensaje del commit.")"
          echo "PR: $PR_URL"

          gh pr merge "$PR_URL" --squash --delete-branch=false

          git fetch origin main
          git checkout -q origin/main

          git tag "$VERSION"
          git push origin "$VERSION"

          gh release create "$VERSION" \
            --generate-notes \
            --title "Release $VERSION"

          echo "Tag y release creados: $VERSION"
