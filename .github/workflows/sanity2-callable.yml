name: sanity2-callable

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: guard
        run: echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: step con if
        if: steps.guard.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "ok $GH_TOKEN"