name: Rollback to commit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA exacto al que quieres volver"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  rollback:
    name: Restaurar commit
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar commit
        run: |
          set -e
          SHA="${{ inputs.commit_sha }}"

          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "El commit ${SHA} no existe."
            exit 1
          fi

          echo "Commit encontrado:"
          git log -1 --oneline "${SHA}"

      - name: Restaurar contenido exacto del commit
        run: |
          set -e
          SHA="${{ inputs.commit_sha }}"

          git ls-tree -r main --name-only | sort > /tmp/main_files.txt
          git ls-tree -r "${SHA}" --name-only | sort > /tmp/target_files.txt

          comm -23 /tmp/main_files.txt /tmp/target_files.txt > /tmp/to_delete.txt || true

          if [ -s /tmp/to_delete.txt ]; then
            xargs -a /tmp/to_delete.txt -r git rm -f --ignore-unmatch
          fi

          git checkout "${SHA}" -- .
          git add -A

      - name: Crear Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: rollback/${{ inputs.commit_sha }}
          base: main
          commit-message: "revert: rollback a ${{ inputs.commit_sha }}"
          title: "revert: rollback a ${{ inputs.commit_sha }}"
          body: |
            Este PR restaura el repositorio al contenido exacto del commit:

            ${{ inputs.commit_sha }}

            El historial de Git no se reescribe. Al hacer merge de este PR,
            main quedará con el mismo contenido que tenía ese commit.
          delete-branch: true