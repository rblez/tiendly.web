name: release-main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-bot
  cancel-in-progress: false

jobs:
  bot:
    uses: ./.github/workflows/release-bot.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
