name: Generar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tipos Svelte
        run: npm run check

      - name: Validar formato
        run: npm run format:check

      - name: Generar iconos Android
        run: npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npm run cap:sync

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tiendly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar resumen
        run: |
          echo "## APK generado" >> "$GITHUB_STEP_SUMMARY"
          echo "Descarga el artefacto **tiendly-debug-apk** desde esta ejecución." >> "$GITHUB_STEP_SUMMARY"
          echo "Ruta: android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
