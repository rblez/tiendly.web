name: Setup Sentry

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  setup-sentry:
    name: Configurar Sentry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar Sentry Wizard
        run: |
          npx @sentry/wizard@latest \
            -i sveltekit \
            --saas \
            --org rblez \
            --project tiendly \