name: Setup Sentry

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  setup-sentry:
    name: Configurar Sentry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar Sentry Wizard
        run: |
          npx @sentry/wizard@latest \
            -i sveltekit \
            --saas \
            --org rblez \
            --project tiendly \
            --skip-connect

      - name: Instalar dependencias
        run: npm install

      - name: Verificar proyecto
        run: npm run check

      - name: Crear Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/setup-sentry
          base: main
          commit-message: "chore: configurar Sentry"
          title: "chore: configurar Sentry"
          body: |
            Configuración automática de Sentry para Tiendly.

            El cambio fue generado mediante el Sentry Wizard
            para SvelteKit.

            Antes de hacer merge:
            - Revisar los archivos modificados.
            - Verificar npm run check.
            - Confirmar la configuración del DSN.
          delete-branch: true